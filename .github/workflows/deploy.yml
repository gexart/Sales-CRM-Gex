# Deploys the CRM to Cloudflare whenever main is pushed: checks -> build -> D1 migrations -> Worker deploy.
# One-time setup (GitHub -> Settings -> Secrets and variables -> Actions -> New repository secret):
#   CLOUDFLARE_API_TOKEN   token with: Workers Scripts:Edit, D1:Edit, Workers R2 Storage:Edit, Queues:Edit,
#                          Account Settings:Read, (add Workers Routes:Edit + Zone:Read / DNS:Edit only if you later host gexart.com DNS on Cloudflare)
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare dashboard -> Workers & Pages -> right-hand sidebar
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
    paths-ignore: ["android/**", ".github/workflows/android.yml", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys (or migrations) at once; a newer push waits for the running one.
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets (see the header of .github/workflows/deploy.yml)."
            exit 1
          fi

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # Applies only the migrations that have not run yet, before the new code goes live.
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc

      - name: Deploy Worker and site
        run: npx wrangler deploy

      # Optional: add a repository variable APP_URL (e.g. https://sales.gexart.com) to get a live check after each deploy.
      - name: Health check
        if: vars.APP_URL != ''
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.APP_URL }}/api/v1/health" || true)
            [ "$code" = "200" ] && echo "Live: ${{ vars.APP_URL }} (HTTP 200)" && exit 0
            sleep 6
          done
          echo "::warning::Deployed, but ${{ vars.APP_URL }}/api/v1/health did not return 200."
