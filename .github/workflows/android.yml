# Builds the Gexart Calls Android app and publishes it as a GitHub release (android-v1.0.<run>).
# The CRM imports new releases every hour (Settings → Phone app → "Get latest from GitHub" for now).
name: Android app

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set, so this build uses a temporary debug key. Phones must uninstall the old app before installing it."
          fi

      - name: Check signing key
        if: env.ANDROID_KEYSTORE_PATH != ''
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # Prints only a fingerprint of the keystore file and the password length, never the values.
          FP=$(sha256sum "$ANDROID_KEYSTORE_PATH" | cut -c1-12)
          if keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias gexart >/dev/null 2>&1; then
            echo "::notice::Signing key OK (keystore $FP)"
          else
            echo "::error::Signing key could not be opened (keystore $FP, password length ${#ANDROID_KEYSTORE_PASSWORD}). Re-check the two ANDROID_KEYSTORE_* secrets."
            exit 1
          fi

      - name: Build APK
        working-directory: android
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.0.${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="1.0.${{ github.run_number }}"
          cp android/app/build/outputs/apk/release/app-release.apk "GexartCalls-$V.apk"
          gh release create "android-v$V" "GexartCalls-$V.apk" \
            --title "Gexart Calls $V" \
            --notes "Built from ${GITHUB_SHA::7}. The CRM imports this build automatically (Settings → Phone app)." \
            --target "$GITHUB_SHA"
